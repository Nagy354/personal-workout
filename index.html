<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#171B3D">
<title>Sportacus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --ink:#171B3D; --raised:#232A55; --line:#343C6E;
    --chili:#E63329; --chili-dim:#7A2320; --bone:#F2EDE4; --mute:#8890C4;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--ink); }
  body {
    font-family:Karla, system-ui, sans-serif; color:var(--bone);
    font-size:16px; line-height:1.45; padding:18px 16px 34px;
    max-width:520px; margin:0 auto; -webkit-user-select:none; user-select:none;
    padding-bottom:96px;
  }
  h1,h2,.big,.digits { font-family:Anton, Impact, sans-serif; font-weight:400; letter-spacing:.01em; }
  .date { color:var(--mute); font-size:14px; }
  h1 { font-size:46px; line-height:.92; margin:4px 0 6px; }
  .sub { color:var(--mute); font-size:14px; margin:0 0 22px; }

  .row { display:flex; align-items:stretch; border-top:1px solid var(--line); }
  .row:last-of-type { border-bottom:1px solid var(--line); }
  .ex {
    flex:1; display:flex; align-items:center; gap:13px; text-align:left;
    background:none; border:0; padding:15px 2px; color:var(--bone); font:inherit; cursor:pointer;
  }
  .box { flex:none; width:21px; height:21px; border:1.5px solid var(--mute); display:grid; place-items:center; font-size:13px; color:var(--ink); }
  .ex[aria-pressed="true"] .box { background:var(--chili); border-color:var(--chili); }
  .ex[aria-pressed="true"] .name { text-decoration:line-through; color:var(--mute); }
  .name { flex:1; }
  .reps { color:var(--mute); font-size:14px; flex:none; }
  .clock { flex:none; width:52px; background:none; border:0; border-left:1px solid var(--line); color:var(--mute); font:inherit; font-size:19px; cursor:pointer; }
  .clock:active { color:var(--chili); }

  .btn { display:block; width:100%; margin-top:20px; padding:17px; background:var(--chili); color:#fff; border:0; font-family:Anton,sans-serif; font-size:21px; letter-spacing:.02em; cursor:pointer; }
  .btn[disabled] { background:var(--chili-dim); color:#d8b6b3; cursor:default; }
  .btn.ghost { background:none; border:1.5px solid var(--line); color:var(--bone); }
  .quiet { display:block; width:100%; margin-top:12px; padding:10px; background:none; border:0; color:var(--mute); font:inherit; text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--bone); outline-offset:2px; }

  .card { background:var(--raised); padding:18px; margin-top:22px; }
  .card h2 { font-size:22px; margin:0 0 8px; }
  .card p { margin:0; color:var(--mute); font-size:15px; }
  .done { text-align:center; padding:30px 10px; }
  .done .big { font-size:40px; color:var(--chili); }

  .digits { font-size:88px; line-height:1; text-align:center; margin:26px 0 4px; font-variant-numeric:tabular-nums; }
  .digits.ringing { color:var(--chili); }
  .tmode { display:flex; gap:4px; margin-bottom:6px; }
  .tmode button { flex:1; padding:11px; background:none; border:1px solid transparent; color:var(--mute); font:inherit; cursor:pointer; }
  .tmode button[aria-current="true"] { color:var(--bone); border-color:var(--line); background:var(--raised); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .chip { padding:11px 15px; background:none; border:1px solid var(--line); color:var(--bone); font:inherit; font-size:15px; cursor:pointer; }
  .chip[aria-current="true"] { border-color:var(--chili); color:var(--chili); }
  .pair { display:flex; gap:8px; margin-top:18px; }
  .pair .btn { margin-top:0; }

  .grid { display:grid; grid-template-columns:repeat(9,1fr); gap:4px; margin-top:12px; }
  .cell { aspect-ratio:1; border:1px solid var(--line); }
  .cell.full { background:var(--chili); border-color:var(--chili); }
  .cell.floor { background:var(--chili-dim); border-color:var(--chili-dim); }
  .cell.rest { background:var(--line); }
  .cell.missed { border-color:#2b3160; }
  .cell.today { outline:2px solid var(--bone); outline-offset:1px; }

  .stats { display:flex; gap:20px; margin-top:24px; }
  .stat .big { font-size:34px; display:block; line-height:1; }
  .stat .lbl { color:var(--mute); font-size:13px; }

  .rung { display:flex; gap:11px; padding:9px 0; border-top:1px solid var(--line); font-size:15px; }
  .rung .n { color:var(--mute); flex:none; width:16px; }
  .rung.now .n { color:var(--chili); }
  .rung.past { color:var(--mute); }
  .rung.future { color:#565f96; }

  input[type=number] { width:100%; padding:14px; margin-top:10px; background:var(--ink); border:1.5px solid var(--line); color:var(--bone); font:inherit; font-size:17px; user-select:text; }
  textarea { width:100%; height:78px; padding:12px; margin-top:12px; background:var(--ink); border:1.5px solid var(--line); color:var(--bone); font:inherit; font-size:14px; user-select:text; resize:none; }
  .notice { color:var(--chili); font-size:14px; margin-top:12px; }
  nav {
    position:fixed; left:50%; transform:translateX(-50%); bottom:0; z-index:20;
    width:100%; max-width:520px; display:flex; gap:4px;
    background:var(--ink); border-top:1px solid var(--line);
    padding:9px 16px calc(9px + env(safe-area-inset-bottom));
  }
  nav button { flex:1; padding:11px; background:none; border:1px solid transparent; color:var(--mute); font:inherit; cursor:pointer; }
  nav button[aria-current="true"] { color:var(--bone); border-color:var(--line); background:var(--raised); }
  .wlist { margin-top:14px; font-size:15px; }
  .wrow { display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid var(--line); color:var(--mute); }
  .wrow b { color:var(--bone); font-weight:600; }
  .err { color:var(--chili); font-size:14px; margin-top:14px; }
</style>

<div id="app"><p class="sub">Opening your log…</p></div>

<script>
const KEY='sportacus:state', TOTAL_DAYS=63;

const PHASE1=[['Knee push-ups','2 × 8',0],['Bodyweight squats','2 × 12',0],['Reverse snow angels','2 × 10',0],
  ['Plank','2 × 20 sec',20],['Grip trainer','3 × 12 / hand',0]];
const PHASE2=[['Push-ups','2 short of failure',0],['Split squats','3 × 10 / leg',0],['Reverse snow angels','3 × 12',0],
  ['Single-leg glute bridge','2 × 12 / leg',0],['Hollow body hold','3 × 30 sec',30],['Side plank','2 × 30 sec / side',30],['Grip trainer','3 × 12 / hand',0]];
const LADDER=['Knee push-ups','Negatives — lower as slowly as you can','Full push-ups',
  'Full push-ups, 3-second lowering','Full push-ups, 2-second pause at the bottom','Diamond push-ups','Archer push-ups'];

let S=null, tab='today', saveError=false, notice='';

/* ---- storage: Claude's store when inside Claude, browser storage when standalone ---- */
const store={
  async get(k){ if(window.storage){const r=await window.storage.get(k); return r?r.value:null;} return localStorage.getItem(k); },
  async set(k,v){ if(window.storage){return await window.storage.set(k,v);} localStorage.setItem(k,v); return true; }
};

const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d);};
const shift=(s,n)=>{const d=parse(s); d.setDate(d.getDate()+n); return iso(d);};
const daysFrom=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const today=()=>iso(new Date());
const weekOf=d=>Math.floor(daysFrom(S.start,d)/7)+1;
const phaseOf=d=>S.phaseOverride||(weekOf(d)<=3?1:2);
const stepsOf=d=>{const w=weekOf(d); return w<=1?5000:w===2?6500:8000;};
const typeOf=d=>{const n=parse(d).getDay(); return n===0?'rest':(n%2===0?'strength':'walk');};
const plan=d=>phaseOf(d)===1?PHASE1:PHASE2;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fresh=()=>({start:today(),log:{},weights:[],rung:1,phaseOverride:null,startWeight:null});

async function load(){ try{ const v=await store.get(KEY); S=v?JSON.parse(v):fresh(); if(!S||!S.start) S=fresh(); }catch(e){ S=fresh(); } }
async function save(){ try{ saveError=!(await store.set(KEY,JSON.stringify(S))); }catch(e){ saveError=true; } if(tab!=='timer') render(); }

function streak(){
  let n=0,d=today();
  for(;;){
    const e=S.log[d];
    if(e&&e.mode) n++;
    else if(typeOf(d)==='rest'){}
    else if(d===today()){}
    else break;
    d=shift(d,-1);
    if(daysFrom(S.start,d)<0) break;
  }
  return n;
}
const sessionsDone=()=>Object.values(S.log).filter(e=>e.mode).length;

function cellClass(date){
  const e=S.log[date];
  if(e&&e.mode==='off') return 'rest';
  if(e&&e.mode==='floor') return 'floor';
  if(e&&e.mode) return 'full';
  if(daysFrom(date,today())<0) return '';
  if(typeOf(date)==='rest') return 'rest';
  if(date===today()) return '';
  return 'missed';
}

/* ============ TIMER ============ */
const TKEY='sportacus:timer';
const T={mode:'countdown',preset:30,remaining:30,elapsed:0,running:false,endAt:0,startedAt:0,ringing:false,ctx:null};
let loop=null;

function beep(){
  try{
    T.ctx=T.ctx||new (window.AudioContext||window.webkitAudioContext)();
    [0,0.28,0.56].forEach(t=>{
      const o=T.ctx.createOscillator(), g=T.ctx.createGain();
      o.frequency.value=880; o.connect(g); g.connect(T.ctx.destination);
      const s=T.ctx.currentTime+t;
      g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(0.4,s+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,s+0.2);
      o.start(s); o.stop(s+0.22);
    });
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200,100,300]);
}
const mmss=s=>{s=Math.max(0,s); return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;};

/* value is always derived from the clock, so throttling and backgrounding can't drift it */
function tValue(){
  if(T.mode==='countdown') return T.running ? Math.max(0,(T.endAt-Date.now())/1000) : T.remaining;
  return T.running ? T.elapsed+(Date.now()-T.startedAt)/1000 : T.elapsed;
}
function persistT(){
  const {mode,preset,remaining,elapsed,running,endAt,startedAt,ringing}=T;
  try{ store.set(TKEY,JSON.stringify({mode,preset,remaining,elapsed,running,endAt,startedAt,ringing})); }catch(e){}
}
async function restoreT(){
  let s=null;
  try{ const v=await store.get(TKEY); s=v?JSON.parse(v):null; }catch(e){}
  if(!s) return;
  Object.assign(T,s);
  if(T.mode==='countdown'&&T.running){
    if(Date.now()>=T.endAt){ T.running=false; T.remaining=0; T.ringing=true; }
  }
  if(T.running) runLoop();
}
function runLoop(){ clearInterval(loop); loop=setInterval(tick,200); }

function paint(){
  const d=document.getElementById('digits');
  if(d){
    d.textContent=mmss(tValue());
    d.classList.toggle('ringing',T.ringing);
  }
  const b=document.getElementById('startstop');
  if(b) b.textContent=T.running?'Pause':(T.mode==='countdown'&&tValue()<=0?'Reset':'Start');
  const n=document.getElementById('navtimer');
  if(n) n.textContent=T.running?'Timer ●':'Timer';
}
function tick(){
  if(T.mode==='countdown'&&T.running&&tValue()<=0){
    T.running=false; T.remaining=0; T.ringing=true;
    clearInterval(loop); loop=null; persistT(); beep();
  }
  paint();
}
function startTimer(){
  if(T.mode==='countdown'){
    if(T.remaining<=0){ T.remaining=T.preset; T.ringing=false; persistT(); paint(); return; }
    T.endAt=Date.now()+T.remaining*1000;
  } else T.startedAt=Date.now();
  T.ringing=false; T.running=true; runLoop();
  try{ T.ctx=T.ctx||new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  persistT(); paint();
}
function stopTimer(){
  if(T.running){
    if(T.mode==='countdown') T.remaining=Math.max(0,(T.endAt-Date.now())/1000);
    else T.elapsed+= (Date.now()-T.startedAt)/1000;
  }
  T.running=false; clearInterval(loop); loop=null; persistT(); paint();
}
function resetTimer(){ stopTimer(); T.ringing=false; T.remaining=T.preset; T.elapsed=0; persistT(); paint(); }
function openTimer(secs){
  stopTimer(); T.ringing=false;
  if(secs){ T.mode='countdown'; T.preset=secs; T.remaining=secs; } else T.elapsed=0;
  persistT(); tab='timer'; render();
}
/* keep the display honest after the phone sleeps or Chrome throttles the tab */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible') return;
  if(T.running){
    if(T.mode==='countdown'&&tValue()<=0){
      T.running=false; T.remaining=0; T.ringing=true;
      clearInterval(loop); loop=null; persistT(); beep();
    } else runLoop();
  }
  paint();
});

function timerView(){
  const presets=[20,30,45,60,90,120];
  return `<h1>Timer</h1><p class="sub">For holds and for rest between sets.</p>
  <div class="tmode">
    <button data-act="tmode" data-m="countdown" aria-current="${T.mode==='countdown'}">Countdown</button>
    <button data-act="tmode" data-m="stopwatch" aria-current="${T.mode==='stopwatch'}">Stopwatch</button>
  </div>
  <div class="digits${T.ringing?' ringing':''}" id="digits">0:00</div>
  <p class="sub" style="text-align:center;margin:0">${T.ringing?'Time. Next set.':(T.mode==='countdown'?`${T.preset} second hold`:'Counting up')}</p>
  ${T.mode==='countdown'?`<div class="chips">${presets.map(p=>
    `<button class="chip" data-act="preset" data-s="${p}" aria-current="${T.preset===p}">${p<60?p+'s':(p/60)+' min'}</button>`).join('')}</div>`:''}
  <div class="pair">
    <button class="btn" id="startstop" data-act="startstop">Start</button>
    <button class="btn ghost" data-act="reset" style="flex:0 0 40%">Reset</button>
  </div>
  <div class="card"><h2>Rest between sets</h2><p>60 to 90 seconds. Longer if you need it — nobody is timing you except this.</p></div>`;
}

/* ============ VIEWS ============ */
function weighIn(){
  const last=S.weights[S.weights.length-1];
  return `<div class="card"><h2>Weekly weigh-in</h2>
    <p>Morning, after the bathroom, before eating.${last?` Last: ${last.kg} kg.`:''}</p>
    <input type="number" step="0.1" inputmode="decimal" id="wkg" placeholder="kg">
    <button class="btn ghost" data-act="weigh">Save weight</button>
    <p class="sub" style="margin-top:14px">Starting weight (day 1), if different from your first log: ${S.startWeight!=null?S.startWeight+' kg':'not set'}</p>
    <input type="number" step="0.1" inputmode="decimal" id="wstart" placeholder="starting kg">
    <button class="btn ghost" data-act="setstart">Set starting weight</button></div>`;
}

function stepsRow(t,e){
  return `<div class="row">
    <button class="ex" data-act="steps" aria-pressed="${!!e.walked}">
      <span class="box">✓</span><span class="name">Walk ${stepsOf(t).toLocaleString()} steps</span><span class="reps">every day</span>
    </button></div>`;
}

function backupCard(){
  return `<div class="card"><h2>Backup</h2>
    <p>Your log lives in this phone's browser only. Copy it somewhere safe now and then — a note to yourself, a WhatsApp message, anywhere you'll find it again.</p>
    <button class="btn ghost" data-act="copy">Copy my data</button>
    <textarea id="restorebox" placeholder="Paste a backup here to restore it"></textarea>
    <button class="btn ghost" data-act="restore" style="margin-top:10px">Restore from backup</button>
    ${notice?`<p class="notice">${esc(notice)}</p>`:''}</div>`;
}

function todayView(){
  const t=today(), type=typeOf(t), e=S.log[t]||{}, week=weekOf(t);
  const label=parse(t).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});
  const title=type==='strength'?'Strength':type==='walk'?'Walk':'Rest day';
  let h=`<p class="date">${label}</p><h1>${title}</h1>
    <p class="sub">Phase ${phaseOf(t)}, week ${week} of 9 &nbsp;·&nbsp; ${stepsOf(t).toLocaleString()} steps today</p>`;

  if(e.mode==='off'){
    h+=`<div class="card done"><span class="big">Day off</span>
      <p>Logged. Rest is part of it — you'll be better for the next one. Streak intact.</p></div>`;
  } else if(e.mode==='floor'){
    h+=`<div class="card done"><span class="big">Floor cleared</span>
      <p>You showed up on a day you didn't want to. That's the whole point of the floor. Streak intact.</p></div>`;
  } else if(e.mode){
    h+=`<div class="card done"><span class="big">Session logged</span>
      <p>${type==='walk'?'Steps in the bank.':'Six exercises, done.'} Next one is ${parse(shift(t,1)).toLocaleDateString(undefined,{weekday:'long'})}.</p></div>`;
    if(type!=='walk') h+=stepsRow(t,e);
  } else if(type==='rest'){
    h+=`<div class="card"><h2>No mat work today</h2>
      <p>Sunday rests your muscles, not your legs. Walking is still on — it doesn't interfere with recovery. Weigh in first, before you head out.</p></div>`
      +weighIn()+stepsRow(t,e);
  } else if(type==='walk'){
    h+=`<div class="card"><h2>${stepsOf(t).toLocaleString()} steps</h2>
      <p>Outside, one walk or two. Roughly ${Math.round(stepsOf(t)/125)} minutes of actual walking.</p></div>
      <button class="btn" data-act="walked">I walked</button>
      <button class="quiet" data-act="floor">Not feeling it today</button>`;
  } else {
    const done=e.done||[];
    h+=plan(t).map(([name,reps,secs],i)=>
      `<div class="row">
        <button class="ex" data-act="tick" data-i="${i}" aria-pressed="${done.includes(i)}">
          <span class="box">✓</span><span class="name">${esc(name)}</span><span class="reps">${esc(reps)}</span>
        </button>
        ${secs?`<button class="clock" data-act="timeit" data-s="${secs}" aria-label="Time this hold">◷</button>`:''}
      </div>`).join('');
    h+=stepsRow(t,e);
    h+=`<button class="btn" data-act="finish"${done.length?'':' disabled'}>Finish session</button>
      <button class="quiet" data-act="rest90">Rest timer, 90 seconds</button>
      <button class="quiet" data-act="floor">Not feeling it today</button>`;
  }
  return h;
}

function floorView(){
  const t=today(), type=typeOf(t);
  const head=`<p class="date">${parse(t).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'})}</p>
    <h1>The floor</h1><p class="sub">The smallest version that still counts.</p>`;
  const floor = type==='walk'
    ? `<div class="card"><h2>Ten minutes, slow</h2>
        <p>Out the door, easy pace, ten minutes, back. No lap counting. Light movement actually clears soreness faster than sitting still does.</p></div>`
    : `<div class="card"><h2>One set of push-ups</h2>
        <p>Down on the mat, ${phaseOf(t)===1?'knees down':'full push-ups'}, go until two reps before you'd fail. Then get up. That's the entire session.</p></div>`;
  return head + floor + `
    <button class="btn" data-act="didfloor">I did the floor</button>
    <div class="card"><h2>Or genuinely can't today</h2>
      <p>Too sore to stand, sick, or injured. Log it honestly — it keeps your streak and it tells you something real when you look back.</p>
      <button class="btn ghost" data-act="dayoff">Taking today off</button></div>
    <button class="quiet" data-act="back">Actually, I'll do the session</button>`;
}

function progressView(){
  const cells=Array.from({length:TOTAL_DAYS},(_,i)=>{
    const d=shift(S.start,i);
    return `<div class="cell ${cellClass(d)}${d===today()?' today':''}"></div>`;
  }).join('');
  const left=TOTAL_DAYS-daysFrom(S.start,today())-1;
  const w=S.weights, base=S.startWeight!=null?S.startWeight:(w[0]&&w[0].kg), lost=(base!=null&&w.length)?(base-w[w.length-1].kg).toFixed(1):null;

  let h=`<h1>Progress</h1><p class="sub">${left>0?`${left} days until the ceremony`:'Ceremony week'}</p>
    <div class="stats">
      <div class="stat"><span class="big">${streak()}</span><span class="lbl">day streak</span></div>
      <div class="stat"><span class="big">${sessionsDone()}</span><span class="lbl">sessions logged</span></div>
      <div class="stat"><span class="big">${lost!==null?lost:'—'}</span><span class="lbl">kg lost</span></div>
    </div>
    <div class="grid">${cells}</div>
    <p class="sub" style="margin-top:12px">Solid red is a full session, dark red is the floor, grey is Sunday.</p>
    <div class="card"><h2>Push-up ladder</h2><p>Move up when you can do 3 × 12 clean.</p>`;
  h+=LADDER.map((step,i)=>{
    const n=i+1, cls=n<S.rung?'past':n===S.rung?'now':'future';
    return `<div class="rung ${cls}"><span class="n">${n}</span><span>${esc(step)}</span></div>`;
  }).join('');
  if(S.rung<7) h+=`<button class="btn ghost" data-act="rungup">I've earned the next rung</button>`;
  h+=`</div>`;

  const ph=phaseOf(t);
  h+=`<div class="card"><h2>Phase ${ph}</h2>
    <p>${ph===1?"Four exercises, easing in.":"Six exercises, the full session."} Switches automatically at week 4, or move early if a full week goes by with no soreness and Lite feels done.</p>
    <button class="btn ghost" data-act="phase${ph===1?2:1}">Switch to Phase ${ph===1?2:1}</button></div>`;
  h+=weighIn();
  if(w.length) h+=`<div class="wlist">`+w.slice().reverse().map(e=>
    `<div class="wrow"><span>${parse(e.date).toLocaleDateString(undefined,{day:'numeric',month:'short'})}</span><b>${e.kg} kg</b></div>`).join('')+`</div>`;
  return h+backupCard();
}

function render(){
  const body = tab==='today'?todayView() : tab==='floor'?floorView() : tab==='timer'?timerView() : progressView();
  const nav = tab==='floor' ? '' : `<nav>
      <button data-act="tab" data-tab="today" aria-current="${tab==='today'}">Today</button>
      <button id="navtimer" data-act="tab" data-tab="timer" aria-current="${tab==='timer'}">${T.running?'Timer ●':'Timer'}</button>
      <button data-act="tab" data-tab="progress" aria-current="${tab==='progress'}">Progress</button>
    </nav>`;
  document.getElementById('app').innerHTML = body + nav +
    (saveError?`<p class="err">That didn't save. Tap it again.</p>`:'');
  paint();
}

document.addEventListener('click', async ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, t=today();

  if(act==='tab'){ notice=''; tab=el.dataset.tab; return render(); }
  if(act==='floor'){ tab='floor'; return render(); }
  if(act==='back'){ tab='today'; return render(); }
  if(act==='timeit') return openTimer(+el.dataset.s);
  if(act==='rest90') return openTimer(90);
  if(act==='tmode'){ stopTimer(); T.mode=el.dataset.m; T.ringing=false; T.elapsed=0; T.remaining=T.preset; return render(); }
  if(act==='preset'){ stopTimer(); T.preset=+el.dataset.s; T.remaining=T.preset; T.ringing=false; return render(); }
  if(act==='startstop') return T.running?stopTimer():startTimer();
  if(act==='reset') return resetTimer();

  if(act==='tick'){
    const i=+el.dataset.i;
    const e=S.log[t]||(S.log[t]={type:typeOf(t),done:[]});
    e.done=e.done||[];
    e.done=e.done.includes(i)?e.done.filter(x=>x!==i):e.done.concat(i);
    return save();
  }
  if(act==='copy'){
    const text=JSON.stringify(S);
    try{ await navigator.clipboard.writeText(text); notice='Copied. Paste it somewhere safe.'; }
    catch(e){
      const ta=document.createElement('textarea');
      ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); notice='Copied. Paste it somewhere safe.'; }
      catch(e2){ notice='Copy failed. Long-press the box below after pasting instead.'; }
      ta.remove();
    }
    return render();
  }
  if(act==='restore'){
    const box=document.getElementById('restorebox'), raw=(box&&box.value||'').trim();
    if(!raw){ notice='Paste a backup into the box first.'; return render(); }
    let data;
    try{ data=JSON.parse(raw); }catch(e){ notice="That isn't a valid backup. Copy the whole thing, including the brackets."; return render(); }
    if(!data||!data.start||!data.log){ notice="That isn't a valid backup."; return render(); }
    if(!confirm('Replace your current log with this backup? Your current log will be gone.')) return;
    S={start:data.start, log:data.log||{}, weights:data.weights||[], rung:data.rung||1, phaseOverride:data.phaseOverride||null, startWeight:data.startWeight||null};
    notice='Restored.';
    return save();
  }
  if(act==='steps'){
    const e=S.log[t]||(S.log[t]={type:typeOf(t),done:[]});
    e.walked=!e.walked;
    return save();
  }
  if(act==='finish'){ S.log[t]={...(S.log[t]||{}),type:typeOf(t),mode:'full'}; return save(); }
  if(act==='walked'){ S.log[t]={type:'walk',mode:'full'}; return save(); }
  if(act==='dayoff'){ S.log[t]={type:typeOf(t),mode:'off'}; tab='today'; return save(); }
  if(act==='didfloor'){ S.log[t]={type:typeOf(t),mode:'floor'}; tab='today'; return save(); }
  if(act==='phase2'){ S.phaseOverride=2; return save(); }
  if(act==='phase1'){ S.phaseOverride=null; return save(); }
  if(act==='rungup'){ S.rung=Math.min(7,S.rung+1); return save(); }
  if(act==='setstart'){
    const inp=document.getElementById('wstart'), kg=parseFloat(inp&&inp.value);
    if(!kg||kg<30||kg>250){ inp&&inp.focus(); return; }
    S.startWeight=Math.round(kg*10)/10;
    return save();
  }
  if(act==='weigh'){
    const inp=document.getElementById('wkg'), kg=parseFloat(inp&&inp.value);
    if(!kg||kg<30||kg>250){ inp&&inp.focus(); return; }
    S.weights=S.weights.filter(x=>x.date!==t).concat({date:t,kg:Math.round(kg*10)/10});
    S.weights.sort((a,b)=>a.date<b.date?-1:1);
    return save();
  }
});

(async()=>{
  try{ await load(); }catch(e){ S=fresh(); }
  try{ await restoreT(); }catch(e){}
  try{ render(); }
  catch(e){ document.getElementById('app').innerHTML='<h1>Something broke</h1><p class="sub">'+e.message+'</p>'; }
})();
/* if the script itself is damaged, say so instead of hanging on the loading line */
window.addEventListener('error',e=>{
  const a=document.getElementById('app');
  if(a&&/Opening your log/.test(a.textContent))
    a.innerHTML='<h1>File incomplete</h1><p class="sub">The copy on the server looks truncated. Re-paste index.html and make sure the last line is the closing script tag.</p>';
});
</script>
